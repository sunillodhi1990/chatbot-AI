// --- Number Order: tap the numbers in ascending (or, from class 3, sometimes descending) order ---
function startSort() {
  clearInterval(gameTimer);
  const g = gradeNum(), rounds = 6;
  const [lo, hi] = g <= 2 ? [1, 20] : g <= 4 ? [1, 100] : g <= 6 ? [1, 1000] : [-50, 500];
  let i = 0, score = 0;
  const round = () => {
    if (i >= rounds) return gEnd('🏆', t('g_score', { n: `${score}/${rounds}` }), startSort);
    const nums = new Set();
    while (nums.size < 5) nums.add(rnd(lo, hi));
    const list = shuffle([...nums]), down = g >= 3 && Math.random() < .4;
    const order = [...list].sort((a, z) => down ? z - a : a - z);
    let pos = 0, mistakes = 0;
    gHead(t('g_sort'), `⭐ ${score} · ${i + 1}/${rounds}`);
    const b = $('g-body');
    b.innerHTML = `<p class="g-sub" style="font-size:16px;font-weight:600"></p><div class="g-sorted"></div><div class="g-nums"></div>`;
    b.querySelector('.g-sub').textContent = t(down ? 'g_sort_down' : 'g_sort_up');
    for (const n of list) {
      const btn = document.createElement('button');
      btn.className = 'g-num';
      btn.textContent = n;
      btn.onclick = () => {
        if (n !== order[pos]) { mistakes++; sfx(false); btn.classList.remove('bad'); void btn.offsetWidth; btn.classList.add('bad'); return; }
        btn.classList.add('used');
        const s = document.createElement('span');
        s.textContent = n;
        b.querySelector('.g-sorted').appendChild(s);
        pos++;
        if (pos < order.length) return sfx(true);
        // a round counts as a win when it was finished with at most one slip
        if (mistakes <= 1) { score++; addStar(); }
        sfx(true); cheer();
        setTimeout(() => { i++; round(); }, 900);
      };
      b.querySelector('.g-nums').appendChild(btn);
    }
  };
  round();
}

// --- Typing Hero: type the falling words before they land; faster as the score grows ---
const EASY_TYPE = ['a', 's', 'd', 'f', 'j', 'k', 'l', 'e', 'o', 'cat', 'dog', 'sun', 'hat', 'pen', 'cup', 'bus', 'red', 'egg', 'cow'];
const HARD_TYPE = ['school', 'teacher', 'science', 'computer', 'keyboard', 'planet', 'library', 'pencil', 'friend', 'garden', 'history', 'rainbow', 'kitchen', 'monsoon'];
function startTyping() {
  clearInterval(gameTimer);
  const g = gradeNum();
  const base = GAME_WORDS.map(w => w.en.toLowerCase());
  const pool = g <= 2 ? EASY_TYPE : g <= 5 ? base.filter(w => w.length <= 7) : [...base, ...HARD_TYPE];
  const speed = g <= 2 ? .45 : g <= 5 ? .55 : .65; // % of the arena per 50 ms tick
  let falling = [], score = 0, lives = 3, tick = 0, over = false;
  const head = () => gHead(t('g_type'), `${'❤️'.repeat(lives)} · ✍️ ${score}`);
  const b = $('g-body');
  b.innerHTML = `<p class="g-sub"></p><div class="g-arena"></div><input class="g-type" autocomplete="off" autocapitalize="off" spellcheck="false">`;
  b.querySelector('.g-sub').textContent = t('g_type_d');
  const arena = b.querySelector('.g-arena'), inp = b.querySelector('.g-type');
  inp.placeholder = t('g_type_ph');
  head();
  const spawn = () => {
    const onScreen = falling.map(w => w.text);
    const choices = pool.filter(w => !onScreen.includes(w));
    const text = choices[rnd(0, choices.length - 1)];
    const el = document.createElement('div');
    el.className = 'g-fall';
    el.textContent = text;
    el.style.left = rnd(4, 72) + '%';
    el.style.top = '0%';
    arena.appendChild(el);
    falling.push({ text, el, y: 0 });
  };
  const end = () => { over = true; gEnd('⌨️', t('g_type_end', { n: score }), startTyping); };
  inp.oninput = () => {
    const v = inp.value.trim().toLowerCase();
    falling.forEach(w => w.el.classList.toggle('match', !!v && w.text.startsWith(v)));
    const hitIdx = falling.findIndex(w => w.text === v);
    if (hitIdx < 0) return;
    const [w] = falling.splice(hitIdx, 1);
    w.el.classList.add('pop');
    setTimeout(() => w.el.remove(), 300);
    inp.value = '';
    score++;
    sfx(true);
    if (score % 5 === 0) { addStar(); cheer(); }
    head();
  };
  inp.onkeydown = e => { if (e.key === 'Enter' && inp.value) { sfx(false); inp.value = ''; inp.oninput(); } };
  spawn();
  inp.focus();
  gameTimer = setInterval(() => {
    if (over) return;
    tick++;
    const every = Math.max(22, 50 - score * 2); // new word more often as you improve
    if (tick % every === 0 || !falling.length) spawn();
    for (const w of [...falling]) {
      w.y += speed * (1 + score * .04);
      w.el.style.top = w.y + '%';
      if (w.y >= 88) {
        falling.splice(falling.indexOf(w), 1);
        w.el.remove();
        lives--;
        sfx(false);
        arena.classList.remove('hit'); void arena.offsetWidth; arena.classList.add('hit');
        head();
        if (lives <= 0) return end();
      }
    }
  }, 50);
}

// --- Quiz Race: right answers boost your car; the robot car drives at a steady pace ---
function raceQuestion() {
  if (Math.random() < .5) return mathQuestion(gradeNum());
  const w = GAME_WORDS[rnd(0, GAME_WORDS.length - 1)];
  const name = x => x.en[0] + x.en.slice(1).toLowerCase();
  const others = shuffle(GAME_WORDS.filter(x => x !== w)).slice(0, 3).map(name);
  return { text: `${w.e} = ?`, ans: name(w), opts: shuffle([name(w), ...others]) };
}
function startRace() {
  clearInterval(gameTimer);
  let me = 0, bot = 0, score = 0, locked = false, over = false, q;
  gHead(t('g_race'), '⭐ 0');
  const b = $('g-body');
  b.innerHTML = `<div class="g-track">
      <div class="g-lane"><span class="name"></span><span class="flag">🏁</span><span class="g-car" id="car-me">🚗</span></div>
      <div class="g-lane"><span class="name"></span><span class="flag">🏁</span><span class="g-car" id="car-bot">🚙</span></div>
    </div><div class="g-q"></div><div class="g-opts"></div>`;
  const names = b.querySelectorAll('.name');
  names[0].textContent = t('g_you');
  names[1].textContent = '🤖 ' + t('g_robot');
  const move = () => { $('car-me').style.setProperty('--p', Math.min(me, 100)); $('car-bot').style.setProperty('--p', Math.min(bot, 100)); };
  const finish = won => {
    over = true;
    clearInterval(gameTimer);
    if (won) { sfx(true); cheer(); }
    setTimeout(() => gEnd(won ? '🏆' : '🤖', t(won ? 'g_win' : 'g_lose'), startRace), 700);
  };
  const flash = cls => { const c = $('car-me'); c.classList.remove('boost', 'bump'); void c.offsetWidth; c.classList.add(cls); };
  const next = () => {
    q = raceQuestion();
    b.querySelector('.g-q').textContent = q.text;
    const box = b.querySelector('.g-opts');
    box.innerHTML = '';
    for (const v of q.opts) {
      const o = document.createElement('button');
      o.className = 'g-opt';
      o.style.fontSize = typeof v === 'string' ? '20px' : '';
      o.textContent = v;
      o.onclick = () => {
        if (locked || over) return;
        locked = true;
        recordAnswer(v === q.ans);
        if (v === q.ans) {
          me += 12; score++;
          o.classList.add('ok'); flash('boost'); sfx(true); addStar();
          gHead(t('g_race'), `⭐ ${score}`);
        } else {
          me = Math.max(0, me - 3);
          o.classList.add('bad'); flash('bump'); sfx(false);
          [...box.children].find(x => x.textContent === String(q.ans)).classList.add('ok');
        }
        move();
        if (me >= 100) return finish(true);
        setTimeout(() => { locked = false; if (!over) next(); }, 600);
      };
      box.appendChild(o);
    }
  };
  move(); next();
  // the robot car finishes in about 45 seconds
  gameTimer = setInterval(() => { bot += 1.1; move(); if (bot >= 100 && !over) finish(false); }, 500);
}

// --- Word Builder: tap letters in order; Hindi mode also shows the Hindi meaning ---
function startWord() {
  clearInterval(gameTimer);
  const g = gradeNum(), maxLen = g <= 2 ? 4 : g <= 5 ? 6 : 9;
  const words = shuffle(GAME_WORDS.filter(w => w.en.length <= maxLen)).slice(0, 8);
  let i = 0, score = 0;
  const round = () => {
    if (i >= words.length) return gEnd('🏆', t('g_score', { n: `${score}/${words.length}` }), startWord);
    const w = words[i];
    let tiles = shuffle(w.en.split(''));
    if (tiles.join('') === w.en && w.en.length > 1) tiles = tiles.reverse();
    let filled = [], done = false;
    gHead(t('g_word'), `⭐ ${score} · ${i + 1}/${words.length}`);
    const b = $('g-body');
    b.innerHTML = `<div class="g-emoji"></div><p class="g-sub"></p><div class="g-slots"></div><div class="g-tiles"></div>
      <div class="g-row"><button class="g-btn" data-a="hear"></button><button class="g-btn" data-a="hint"></button><button class="g-btn" data-a="skip"></button></div>`;
    b.querySelector('.g-emoji').textContent = w.e;
    b.querySelector('.g-sub').textContent = (uiLang() === 'hi' ? w.hi + ' – ' : '') + t('g_spell');
    b.querySelector('[data-a=hear]').textContent = t('g_hear');
    b.querySelector('[data-a=hint]').textContent = t('g_hint');
    b.querySelector('[data-a=skip]').textContent = t('g_skip');
    b.querySelector('[data-a=hear]').onclick = () => sayWord(w.en.toLowerCase());
    b.querySelector('[data-a=skip]').onclick = () => { i++; round(); };
    b.querySelector('[data-a=hint]').onclick = () => {
      if (done) return;
      // keep the correct start of the answer, then add the next right letter
      let k = 0;
      while (k < filled.length && tiles[filled[k]] === w.en[k]) k++;
      filled = filled.slice(0, k);
      const idx = tiles.findIndex((ch, j) => ch === w.en[k] && !filled.includes(j));
      if (idx >= 0) filled.push(idx);
      draw();
    };
    const draw = () => {
      const slots = b.querySelector('.g-slots'), tl = b.querySelector('.g-tiles');
      slots.innerHTML = ''; tl.innerHTML = '';
      w.en.split('').forEach((_, k) => {
        const s = document.createElement('button');
        s.className = 'g-slot' + (filled[k] !== undefined ? ' filled' : '');
        s.textContent = filled[k] !== undefined ? tiles[filled[k]] : '';
        s.onclick = () => { if (!done) { filled = filled.slice(0, k); draw(); } };
        slots.appendChild(s);
      });
      tiles.forEach((ch, j) => {
        const tb = document.createElement('button');
        tb.className = 'g-tile' + (filled.includes(j) ? ' used' : '');
        tb.textContent = ch;
        tb.onclick = () => { if (!done && !filled.includes(j)) { filled.push(j); draw(); check(); } };
        tl.appendChild(tb);
      });
    };
    const check = () => {
      if (filled.length < w.en.length) return;
      const slots = [...b.querySelectorAll('.g-slot')];
      const right = filled.map(j => tiles[j]).join('') === w.en;
      recordAnswer(right);
      if (right) {
        done = true; score++;
        slots.forEach(s => s.classList.add('ok'));
        addStar(); sfx(true); cheer(); sayWord(w.en.toLowerCase());
        setTimeout(() => { i++; round(); }, 1400);
      } else {
        sfx(false);
        slots.forEach(s => s.classList.add('bad'));
        setTimeout(() => { filled = []; draw(); }, 700);
      }
    };
    draw();
  };
  round();
}

// --- Memory Match: picture card <-> word card (English or Hindi, by interface language) ---
function startMemory() {
  clearInterval(gameTimer);

  const cards = shuffle(pairs.flatMap((w, id) => [{ id, html: `<span class="big">${w.e}</span>` }, { id, html: word(w) }]));
  let open = [], matched = 0, moves = 0, lock = false;
  gHead(t('g_memory'), t('g_moves', { n: 0 }));
  const b = $('g-body');
  b.innerHTML = `<p class="g-sub"></p><div class="g-grid"></div>`;
  b.querySelector('.g-sub').textContent = t('g_memory_d');
  const grid = b.querySelector('.g-grid');
  cards.forEach((c, k) => {
    const el = document.createElement('button');
    el.className = 'g-mem';
    el.textContent = '?';
    el.onclick = () => {
      if (lock || open.includes(k) || el.classList.contains('done')) return;
      el.classList.add('open');
      el.innerHTML = c.html;
      open.push(k);
      if (open.length < 2) return;
      moves++;
      gHead(t('g_memory'), t('g_moves', { n: moves }));
      const [a, z] = open.map(n => grid.children[n]);
      if (cards[open[0]].id === cards[open[1]].id) {
        a.classList.add('done'); z.classList.add('done');
        open = []; matched++;
        sfx(true); cheer();
        if (matched === pairs.length) { addStar(); setTimeout(() => gEnd('🎉', t('g_done', { n: moves }), startMemory), 700); }
      } else {
        lock = true;
        setTimeout(() => {
          [a, z].forEach(x => { x.classList.remove('open'); x.textContent = '?'; });

      }

}

// ---------- Natural neural voice (server.py /api/tts) with real lip-sync ----------
let audioCtx = null, currentAudio = null;
function stopSpeaking() {
  speechSynthesis.cancel();
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
}

async function speakNeural(text) {
  const res = await fetch('/api/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, lang: $('lang').value, voice: $('voice').value, style: $('vstyle').value })
  });
  if (!res.ok) throw new Error('TTS failed');
  const url = URL.createObjectURL(await res.blob());
  stopSpeaking();
  const a = new Audio(url);
  currentAudio = a;
  audioCtx ||= new AudioContext();
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  const analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  audioCtx.createMediaElementSource(a).connect(analyser);
  analyser.connect(audioCtx.destination);

  // Mouth opening follows the loudness (RMS) of the voice, smoothed
  const buf = new Uint8Array(analyser.fftSize);
  let open = 0;
  const lip = () => {
    analyser.getByteTimeDomainData(buf);
    let sum = 0;
    for (const v of buf) sum += (v - 128) ** 2;
    const rms = Math.sqrt(sum / buf.length) / 128;
    const target = Math.min(.85, Math.max(0, (rms - .015) * 7));
    open += (target - open) * .45;
    avatarEl.style.setProperty('--open', open.toFixed(2));
    lipRaf = requestAnimationFrame(lip);
  };
  const done = () => {
    URL.revokeObjectURL(url);
    if (currentAudio === a) currentAudio = null;
    if ($('stage').className === 'speaking') setAvatar('idle');
  };
  a.onplay = () => { setAvatar('speaking', true); lip(); };
  a.onended = a.onpause = a.onerror = done;
  await a.play();
}

// ---------- Browser text to speech fallback (female voice preferred) ----------
const FEMALE = /female|swara|neerja|heera|kalpana|aditi|raveena|veena|lekha|zira|aria|jenny|samantha|susan|hazel|google हिन्दी|google us english|google uk english female/i;
const MALE = /\bmale\b|ravi|hemant|prabhat|madhur|david|mark|guy|george|rishi/i;
// Browser-voice fallback: follow the chosen voice's gender where the browser offers one
function pickVoice(lang, male = isMaleVoice()) {
  const all = speechSynthesis.getVoices().filter(v => v.lang.replace('_', '-') === lang);
  if (male) return all.find(v => MALE.test(v.name)) || all[0];
  return all.find(v => FEMALE.test(v.name)) || all.find(v => !MALE.test(v.name)) || all[0];
}
let voiceWarned = false; // show the "natural voices unavailable" note only once

// force: speak even when "Speak replies out loud" is off (the "Listen again" button)
async function speak(text, force = false) {
  if (!force && !$('speak').checked) {
    // Voice off: still move the mouth for roughly the reply's length
    setAvatar('speaking');
    stateTimer = setTimeout(() => setAvatar('idle'), Math.min(6000, 600 + text.length * 40));
    return;
  }
  text = text.replace(/[*#`_]/g, '');
  try { await speakNeural(text); return; }
  catch (e) {
    console.warn('Neural voice unavailable, using browser voice:', e);
    // a blocked autoplay isn't a server problem, so only warn for real failures
    if (!voiceWarned && e.name !== 'NotAllowedError') { voiceWarned = true; add(t('e_voice'), 'err'); }
  }
  speakBrowser(text);
}

async function askGemini(system, key) {
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent($('model').value.trim())}:generateContent`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents: recentHistory().map(m => ({
        role: m.role,
        parts: m.parts.map(p => p.inlineData ? { inlineData: p.inlineData } : { text: p.text }),
      })) })
    }
  );
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || res.statusText);
  return data.candidates?.[0]?.content?.parts?.map(p => p.text).join('');
}

// ChatGPT, Claude, Groq, OpenRouter, DeepSeek, Mistral: called by server.py with the user's key.
// Only the latest message's image is sent; earlier images become a short note to save tokens.
async function askProxy(provider, system, key) {
  const msgs = recentHistory(), last = msgs.length - 1;
  const messages = msgs.map((m, i) => {
    const img = m.parts.find(p => p.inlineData);
    return {
      role: m.role === 'model' ? 'assistant' : 'user',
      text: (img && i !== last ? '[shared an image] ' : '') + apiTextOf(m),
      image: img && i === last ? img.inlineData : undefined,
    };
  });
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ provider, key, model: $('model').value.trim() || PROVIDERS[provider].model, system, messages })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error?.message || res.statusText);
  return data.text;
}

// Free, no-key OpenAI-compatible endpoint (rate-limited), proxied by server.py
async function askFree(system) {
  const messages = [{ role: 'system', content: system }].concat(
    recentHistory().map(m => ({
      role: m.role === 'model' ? 'assistant' : 'user',
      content: (imageOf(m) ? '[shared an image] ' : '') + apiTextOf(m)
    }))
  );
  const res = await fetch('/api/free', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'openai', messages })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error?.message || data.error || res.statusText);
  return data.choices?.[0]?.message?.content;
}

let pending = null; // { mimeType, data (base64), url }

// Downscale to max 1024px JPEG so uploads are fast and fit in saved history
function loadImage(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const img = new Image();
  const src = URL.createObjectURL(file);
  img.onload = () => {
    const scale = Math.min(1, 1024 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * scale);
    c.height = Math.round(img.height * scale);
    const g = c.getContext('2d');
    g.fillStyle = '#fff';
    g.fillRect(0, 0, c.width, c.height);
    g.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(src);
    const url = c.toDataURL('image/jpeg', .85);
    setPending({ mimeType: 'image/jpeg', data: url.split(',')[1], url });
  };
  img.onerror = () => { URL.revokeObjectURL(src); add("Couldn't read that image. Please try another file.", 'err'); };
  img.src = src;
}
function setPending(p) {
  pending = p;
  $('preview').hidden = !p;
  if (p) { $('preview-img').src = p.url; $('text').focus(); }
}

async function ask(q) {
  q = q.trim();
  const img = pending, attached = doc;
  if (!q && !img && !attached) return;
  if (!q && attached) q = t('doc_default_q');
  const provider = $('provider').value, P = PROVIDERS[provider];
  const key = $('apiKey').value.trim();
  if (img && !P.vision) {
    add(t('e_vision', { p: P.name }), 'err');
    return;
  }
  if (provider !== 'free' && !key) { add(t('e_key', { p: P.name }), 'err'); return; }
  $('text').value = '';
  setPending(null);
  if (attached) { q = `📄 ${attached.name}\n${q}`; setDoc(null); }
  add(q, 'user', img?.url);
  const parts = [{ text: q || 'Please explain this image.' }];
  if (img) parts.unshift({ inlineData: { mimeType: img.mimeType, data: img.data } });
  // the document's text travels with this message (hidden from the chat), so later questions can use it too
  if (attached) parts.push({ note: true, text: `(Attached document "${attached.name}":\n${attached.text})` });
  trackChat();
  // Quiz: grade the answer locally and pass the verdict to the AI as a hidden teacher note
  let correct = null;
  if (audience === 'kids' && mode === 'quiz' && quizKey && q) {
    correct = checkAnswer(q, quizKey);
    recordAnswer(correct);
    const right = `${quizKey.letter ? quizKey.letter.toUpperCase() + ') ' : ''}${quizKey.text}`;
    parts.push({ note: true, text: `(Teacher note: the correct answer is ${right}. The student's answer is ${correct ? 'CORRECT' : 'WRONG'}.)` });
    quizKey = null;
    saveQuizKey();
  }
  history.push({ role: 'user', parts });
  await respond({ img, correct });
}

// Ask the AI to answer the conversation so far. regen = "Regenerate": the last answer was removed and is asked for again.
let busy = false;
async function respond({ img = null, correct = null, regen = false } = {}) {
  const provider = $('provider').value, key = $('apiKey').value.trim();
  busy = true;
  statusEl.textContent = t('st_thinking');
  setAvatar('thinking');
  const typing = showTyping();

  const langName = $('lang').selectedOptions[0].text;
  const grade = $('grade').value, subj = $('subject').value;
  const male = isMaleVoice();
  const hindiForms = male ? `When speaking Hindi, always use masculine first-person forms (e.g. "main kar raha hoon", "main samajh gaya"). `
                          : `When speaking Hindi, always use feminine first-person forms (e.g. "main kar rahi hoon", "main samajh gayi"). `;
  const system = audience === 'pro'
    ? `Your name is AI Chatbot. You are a sharp, friendly ${male ? 'male' : 'female'} AI work assistant (a friendly robot) for working professionals in India. ` +
      `Reply in ${langName}. Be clear, practical and professional. Use no markdown symbols and no emojis. ` +
      `Your replies may be read aloud, so keep normal answers concise (3-6 sentences), but give the full content when asked for a draft, code or a plan. ` +
      `If the user shares an image (for example a document, chart or screenshot), read it carefully and help with it. ` +
      `If a message includes an attached document, answer from that document and say so when the answer is not in it. ` + hindiForms + PRO_RULES[pmode] +
      (pmode === 'write' ? ` Tone: ${STRINGS.en['tone_' + $('w-tone').value]}. Length: ${STRINGS.en['len_' + $('w-len').value]}.` : '')
    : `Your name is AI Chatbot. You are a warm, patient and encouraging ${male ? 'male' : 'female'} AI teacher (a friendly robot) ` +
      `talking face to face with a Class ${grade} student in India. ` +
      `Subject: ${subj === 'all' ? 'any school subject the student asks about' : SUBJECTS[subj]}. ` +
      `Reply in ${langName}. Use simple words and short sentences suited to Class ${grade}, with everyday Indian examples. ` +
      `Your reply is read aloud, so use no markdown, no emojis and no bullet lists. Keep replies short (2-5 sentences) unless telling a story or a poem. ` +
      `Praise effort, and never make the student feel bad for a wrong answer. ` +
      `If the student shares an image (for example a homework photo or textbook page), read it carefully and help with it. ` +
      `If a message includes an attached document, teach from that document. ` +
      `If the student says they did not understand, explain again more simply with a new everyday example. ` +
      `Keep everything age-appropriate and safe for children; if asked about something unsafe or unsuitable, gently decline and suggest asking a parent or teacher. ` +
      hindiForms + MODE_RULES[mode] + (mode === 'quiz' ? adaptiveNote() : '');
  try {
    let answer = (provider === 'free' ? await askFree(system)
      : provider === 'gemini' ? await askGemini(system, key)
      : await askProxy(provider, system, key)) || '(empty reply)';
    // Keep the hidden answer key of the next quiz question; it is never shown or spoken
    const tag = answer.match(ANSWER_TAG);
    if (tag) { quizKey = { letter: tag[1] || '', text: tag[2].trim() }; saveQuizKey(); }
    answer = answer.replace(new RegExp(ANSWER_TAG.source, 'gi'), '').trim() || '(empty reply)';
    // Small models sometimes use markdown anyway: show **bold** / # headings / "- " lists as plain text
    answer = answer.replace(/\*\*(.+?)\*\*/g, '$1').replace(/^#{1,6}\s+/gm, '');
    if (!(audience === 'pro' && pmode === 'code')) answer = answer.replace(/^\s*[-*]\s+/gm, '• '); // keep code untouched
    if (correct) addStar();
    history.push({ role: 'model', parts: [{ text: answer }] });
    saveHistory();
    typing.remove();
    add(answer, 'bot');
    speak(answer);
    statusEl.textContent = ready();
  } catch (err) {
    typing.remove();
    // a failed new question is taken back so it can be retried; a failed regenerate keeps the question
    if (!regen) { history.pop(); if (img) setPending(img); }
    const msg = /failed to fetch|networkerror/i.test(err.message)
      ? t('e_server')
      : /limit reached/i.test(err.message)
        ? t('e_busy')
        : err.message;
    add('Error: ' + msg, 'err');
    statusEl.textContent = t('st_error');
    setAvatar('error');
    stateTimer = setTimeout(() => setAvatar('idle'), 2500);
  } finally {
    busy = false;
  }
}

function copyText(text, btn) {
  const done = () => { if (btn) { btn.classList.add('on'); setTimeout(() => btn.classList.remove('on'), 1200); } };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done, () => {});
  else { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); }
}
function regenerate() {

// ---------- Document chat: PDF / DOCX / TXT / CSV are read in the browser ----------
const DOC_LIMIT = 15000; // characters sent to the AI
let doc = null;          // { name, text } waiting to be sent with the next question
function setDoc(d) {
  doc = d;
  $('docchip').hidden = !d;
  if (d) { $('doc-name').textContent = d.name; $('doc-info').textContent = t('doc_info', { n: d.full.toLocaleString() }) + (d.full > DOC_LIMIT ? t('doc_cut') : ''); $('text').focus(); }
}
async function extractText(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (['txt', 'csv', 'md', 'json'].includes(ext)) return file.text();
  if (ext === 'pdf') {
    const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    await loadScript(PDFJS + 'pdf.min.js');
    // browsers refuse a worker script from another site, so the worker is loaded through a same-page Blob URL
    if (!pdfjsLib.GlobalWorkerOptions.workerPort) {
      const code = await (await fetch(PDFJS + 'pdf.worker.min.js')).text();
      pdfjsLib.GlobalWorkerOptions.workerPort = new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
    }
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let out = '';
    for (let p = 1; p <= Math.min(pdf.numPages, 60) && out.length < DOC_LIMIT * 1.5; p++) {
      const content = await (await pdf.getPage(p)).getTextContent();
      out += content.items.map(i => i.str).join(' ') + '\n\n';
    }
    return out;
  }
  if (ext === 'docx') {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
    return (await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value;
  }
  throw new Error('unsupported');
}
$('doc-file').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  toast(t('doc_reading', { n: file.name }));
  try {
    const text = (await extractText(file)).replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
    if (text.length < 20) throw new Error('empty');
    setDoc({ name: file.name, text: text.slice(0, DOC_LIMIT), full: text.length });
  } catch { add(t('doc_fail'), 'err'); }
};
$('doc-remove').onclick = () => setDoc(null);

// ---------- Progress tracking (per day, kept 60 days) ----------
let prog = (() => { try { return JSON.parse(store.get('gemProg')) || {}; } catch { return {}; } })();
prog.days ||= {}; prog.subj ||= {}; prog.goal ||= 10;
const saveProg = () => {
  const keys = Object.keys(prog.days);
  if (keys.length > 60) keys.slice(0, keys.length - 60).forEach(k => delete prog.days[k]);
  store.set('gemProg', JSON.stringify(prog));
};
const dayRec = (d = new Date()) => (prog.days[dayKey(d)] ||= { stars: 0, q: 0, c: 0, min: 0, chats: 0, tasks: 0 });
function trackStar() { dayRec().stars++; saveProg(); }
function trackChat() { dayRec().chats++; saveProg(); }
function recordAnswer(ok) {
  const r = dayRec(); r.q++; if (ok) r.c++;
  const s = audience === 'kids' ? $('subject').value : 'pro';
  const sr = (prog.subj[s] ||= { q: 0, c: 0 }); sr.q++; if (ok) sr.c++;
  saveProg();
  // adaptive difficulty: two right in a row -> harder, a wrong answer -> easier
  if (ok) { if (++rightRun >= 2 && difficulty < 3) { difficulty++; rightRun = 0; } }
  else { rightRun = 0; if (difficulty > 1) difficulty--; }
  store.set('gemDiff', difficulty);
}
function accuracy(days = 7) {
  let q = 0, c = 0;
  for (let i = 0; i < days; i++) { const r = prog.days[dayKey(new Date(Date.now() - i * 864e5))]; if (r) { q += r.q; c += r.c; } }
  return q ? Math.round(c / q * 100) : null;
}

function runCode(code, out) {
  out.textContent = '';
  const line = (txt, err) => { const s = document.createElement('div'); if (err) s.className = 'cerr'; s.textContent = txt; out.appendChild(s); };
  const prelude = `const _s=(t,a)=>postMessage({t,a:a.map(x=>{try{return typeof x==='object'?JSON.stringify(x):String(x)}catch{return String(x)}}).join(' ')});
    console.log=(...a)=>_s('log',a);console.info=console.log;console.warn=(...a)=>_s('err',a);console.error=(...a)=>_s('err',a);\n`;
  const url = URL.createObjectURL(new Blob([prelude + code + `\npostMessage({t:'done'});`], { type: 'text/javascript' }));
  const w = new Worker(url);
  const stop = setTimeout(() => { w.terminate(); line(t('cd_timeout'), true); }, 3000);
  w.onmessage = e => { if (e.data.t === 'done') { clearTimeout(stop); w.terminate(); line(t('cd_done')); } else line(e.data.a, e.data.t === 'err'); };
  w.onerror = e => { e.preventDefault(); clearTimeout(stop); w.terminate(); line('Error: ' + e.message, true); };
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

      <div class="p-form"><select id="im-style"></select><button class="g-btn primary" id="im-go"></button></div>`;
    $('im-text').placeholder = t('img_ph');
    for (const [k, key] of [['cartoon', 'img_cartoon'], ['water', 'img_water'], ['real', 'img_real'], ['pixel', 'img_pixel']]) $('im-style').add(new Option(t(key), k));
    $('im-go').textContent = t('img_go');
    $('im-go').onclick = () => {
      const p = $('im-text').value.trim();
      if (!p) return $('im-text').focus();
      closePanel();
      add('🎨 ' + p, 'user');
      createImage(p, $('im-style').value);
    };
    $('im-text').focus();
  });
}

// ---------- Toolbar ----------
$('toolbar').querySelectorAll('button').forEach(b => b.onclick = () => ({
  doc: () => $('doc-file').click(), translate: showTranslate, practice: () => { closePanel(); startPractice(); },
  planner: showPlanner, projects: () => showProjects(), progress: showProgress, code: showCode, image: showImage,
})[b.dataset.tool]());

// ---------- Writing Studio: tone + length (Pro > Write) ----------
$('w-tone').value = store.get('gemTone') || 'professional';
$('w-len').value = store.get('gemLen') || 'medium';
$('w-tone').onchange = () => store.set('gemTone', $('w-tone').value);
$('w-len').onchange = () => store.set('gemLen', $('w-len').value);
function fillWriteControls() {
  const tone = store.get('gemTone') || 'professional', len = store.get('gemLen') || 'medium';
  $('w-tone').innerHTML = ''; $('w-len').innerHTML = '';
  for (const k of ['professional', 'friendly', 'formal', 'persuasive', 'casual']) $('w-tone').add(new Option('🎭 ' + t('tone_' + k), k));
  for (const k of ['short', 'medium', 'long']) $('w-len').add(new Option('📏 ' + t('len_' + k), k));
  $('w-tone').value = tone; $('w-len').value = len;
}

// ---------- Safety & privacy: parent PIN, delete data ----------
function requirePin() {
  const pin = store.get('gemPin');
  if (!pin) return true;
  const v = prompt(t('pin_ask'));
  if (v === pin) return true;
  if (v !== null) toast(t('pin_wrong'));
  return false;
}
function syncPinUI() {
  const on = !!store.get('gemPin');
  $('pin').hidden = on;
  $('pin-save').textContent = t(on ? 'pin_clear' : 'pin_set');
  $('pin-note').textContent = t(on ? 'pin_on' : 'pin_off');
}
$('pin-save').onclick = () => {
  if (store.get('gemPin')) {
    if (!requirePin()) return;
    try { localStorage.removeItem('gemPin'); } catch {}
  } else {
    const v = $('pin').value.trim();
    if (!/^\d{4}$/.test(v)) return toast(t('pin_bad'));
    store.set('gemPin', v);
    $('pin').value = '';
  }
  syncPinUI();
};
$('del-chats').onclick = () => {
  if (!confirm(t('del_chats_q'))) return;
  ['gemChats', 'gemSaved'].forEach(k => { try { localStorage.removeItem(k); } catch {} });
  history = []; saveHistory(); renderHistory();
  openSettings(false);
};
$('del-all').onclick = () => {
  if (!confirm(t('del_all_q'))) return;
  try { Object.keys(localStorage).filter(k => k.startsWith('gem')).forEach(k => localStorage.removeItem(k)); } catch {}
  location.reload();
};

// Put every static label into the chosen language (also runs when the Language setting changes)
function applyLang() {
  const L = uiLang();
  document.documentElement.lang = L;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  [...$('grade').options].forEach(o => o.text = t('cls', { n: o.value }));
  [...$('subject').options].forEach(o => o.text = t('s_' + o.value));
  [...$('vstyle').options].forEach(o => o.text = t('sty_' + o.value));
  [...$('voice').options].forEach(o => { const v = currentVoiceById(o.value); if (v) o.text = `${v.g === 'm' ? '👨' : v.g === 'c' ? '👧' : '👩'} ${v.name} · ${t('v_' + v.g)}`; });
  $('modes').querySelectorAll('button').forEach(b => b.querySelector('.ml').textContent = ' ' + t('m_' + b.dataset.mode));
  $('quick').querySelectorAll('button').forEach(b => b.textContent = t(b.dataset.k));
  $('chip-provider').textContent = $('provider').value === 'free' ? t('freeAI') : PROVIDERS[$('provider').value].name;
  if (!$('stage').className || $('stage').className === 'idle') $('mood').textContent = t(audience === 'pro' ? 'mood_idle_pro' : 'mood_idle');
  $('promodes').querySelectorAll('button').forEach(b => b.querySelector('.ml').textContent = ' ' + t('pm_' + b.dataset.pmode));
  $('quickpro').querySelectorAll('button').forEach(b => b.textContent = t(b.dataset.k));
  $('quick-label').textContent = t(audience === 'pro' ? 'ql_pro' : 'ql_kids');
  updateStats();
  fillWriteControls();
  syncPinUI();
  if (doc) setDoc(doc);
  if (!['speaking', 'thinking', 'listening'].includes($('stage').className)) statusEl.textContent = ready();
  renderPicker();
  applyRobot(store.get('gemRobot') || 'aira');
  if ($('welcome')) { $('welcome').remove(); showWelcome(); }
  if (!$('games').hidden) gamesHome();
}
applyLang();
$('mood').textContent = t('mood_hello');
stateTimer = setTimeout(() => { if ($('stage').className === 'hello') setAvatar('idle'); }, 3600);
</script>
</body>
</html>
